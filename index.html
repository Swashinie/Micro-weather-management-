<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .forecast {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;

        }

        .card-component {
            width: 30%;
            height: 300px;
            background: linear-gradient(135deg, #d400fe6f, rgba(187, 85, 144, 0.818));
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            color: white;


        }

        .data {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .error {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <canvas id="particles-canvas"></canvas>
    
    <div class="card">
        <div class="search">
            <input type="text" class="search-bar" placeholder="Enter city name">
            <button><img src="images/search.png"></button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather-card">
            <h2 class="city">Weather in City</h2>
            <div class="time"></div>
            <h2 class="temp">0°C</h2>
            <img src="" class="weather-icon">
            <div class="des">Description</div>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity">0%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind">0 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/pressure.png">
                    <div>
                        <p class="pressure">0 hPa</p>
                        <p>Pressure</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="forecast"></div>

    <footer>
        <p>© 2025 Swashinie Weather App. All rights reserved.</p>
    </footer>

    <script src="particles.js"></script>
    <script src="script.js"></script>
</body>
</html>
